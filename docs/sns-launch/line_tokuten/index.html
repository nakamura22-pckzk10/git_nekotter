<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LINE登録特典一覧</title>
<link rel="stylesheet" href="fonts/fonts.local.css">
<style>
  :root{
    --navy:#0b1d45; --navy2:#16357a; --blue:#1f57c8;
    --gold:#c9a24a; --gold2:#f3d98b; --red:#c8202f;
    --ivory:#fbf8f1; --ink:#111827; --line:#06c755;
    --W:1800px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:var(--W);background:var(--ivory);font-family:'Noto Sans JP',sans-serif;color:var(--ink)}
  .canvas{position:relative;width:var(--W);overflow:hidden;padding:36px 40px 0;
    background:
      radial-gradient(520px 380px at -60px -40px, rgba(22,53,122,.55), transparent 70%),
      radial-gradient(560px 420px at calc(100% + 80px) -60px, rgba(201,162,74,.55), transparent 70%),
      radial-gradient(700px 500px at calc(100% + 120px) 1300px, rgba(31,87,200,.18), transparent 70%),
      radial-gradient(600px 500px at -120px 1100px, rgba(201,162,74,.18), transparent 70%),
      var(--ivory);}
  .serif{font-family:'Noto Serif JP',serif}

  /* ---------- header ---------- */
  .eyebrow{display:flex;align-items:center;justify-content:center;gap:28px;
    font-family:'Noto Serif JP',serif;font-weight:900;font-size:46px;letter-spacing:.2em;color:var(--navy)}
  .eyebrow::before,.eyebrow::after{content:"";height:3px;width:170px;background:linear-gradient(90deg,transparent,var(--gold))}
  .eyebrow::after{transform:scaleX(-1)}
  .eyebrow b{color:var(--gold)}

  .main{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:10px}
  .linebadge{width:180px;height:180px;flex:none;filter:drop-shadow(0 10px 18px rgba(6,120,40,.28))}
  .linebadge img{width:100%;height:100%;display:block}
  .headline{font-family:'Noto Serif JP',serif;font-weight:900;font-size:178px;line-height:1.08;letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--navy) 0%,var(--blue) 55%,var(--navy2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(255,255,255,.9)) drop-shadow(0 12px 18px rgba(11,29,69,.25))}

  .offer{display:flex;align-items:center;width:100%;margin-top:26px;gap:0}
  .stamp{flex:none;position:relative;display:flex;align-items:center;justify-content:center;
    height:170px;padding:0 34px;background:linear-gradient(160deg,#0b1d45,#16357a);color:var(--gold2);
    font-family:'Noto Serif JP',serif;font-weight:900;font-size:84px;letter-spacing:.04em;white-space:nowrap;
    box-shadow:0 10px 22px rgba(11,29,69,.3)}
  .stamp::before{content:"";position:absolute;inset:8px;border:2px solid rgba(243,217,139,.75)}
  .stamp span{background:linear-gradient(180deg,#fff3c4,#e2b654);-webkit-background-clip:text;background-clip:text;color:transparent}
  .copy{flex:1;display:flex;align-items:baseline;justify-content:flex-end;white-space:nowrap;font-family:'Noto Serif JP',serif;font-weight:900;color:var(--ink);font-size:var(--fs,100px);line-height:1}
  .copy .max{position:relative;align-self:flex-start;margin-right:.08em;writing-mode:vertical-rl;text-orientation:upright;
    font-size:.32em;letter-spacing:.04em;color:#fff;background:var(--navy);padding:.2em .12em;border-radius:.1em;line-height:1;margin-left:.2em;margin-top:.22em}
  .copy .hero{position:relative;padding-right:.02em;isolation:isolate}
  .copy .hero::after{content:"";position:absolute;left:-.02em;right:0;bottom:-.08em;height:.12em;background:rgba(200,32,47,.9);z-index:0}
  .copy .hero>*{position:relative;z-index:1}
  .copy .hero .txt{position:relative;z-index:1}
  .copy .num{font-size:1.24em;letter-spacing:-.05em;margin-right:.02em;background:linear-gradient(180deg,#f0cf78,#a8781c);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .03em 0 var(--navy))}
  .copy .wo{font-size:.56em;margin-left:.08em}
  .copy .free{font-size:.8em;margin:0 .02em}
  .free-ink .copy .free{color:var(--ink)}
  .free-gold .copy .free{background:linear-gradient(180deg,#f0cf78,#a8781c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .03em 0 var(--navy))}
  .copy .pre{font-size:.62em;letter-spacing:.01em}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 18px;margin-top:40px}
  .card{position:relative;aspect-ratio:16/9;border-radius:10px;background:#000;
    border:4px solid #fff;box-shadow:0 8px 18px rgba(11,29,69,.28)}
  .card img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
  .badge{position:absolute;top:-16px;right:-12px;width:78px;height:78px;border-radius:50%;background:#fff;
    border:3px solid var(--navy2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--navy2);font-family:'Noto Serif JP',serif;font-weight:900;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .badge small{font-size:17px;letter-spacing:.1em}
  .badge b{font-size:34px;margin-top:2px}

  /* feature card (4日間講義) */
  .feature{grid-column:span 2;min-width:0;border-radius:10px;position:relative;overflow:hidden;
    background:linear-gradient(125deg,#0b1d45 0%,#173a86 58%,#0b1d45 100%);border:4px solid var(--gold);
    box-shadow:0 8px 18px rgba(11,29,69,.35);color:#fff;display:flex;align-items:center;justify-content:center;gap:30px;padding:0 28px}
  .feature::before{content:"";position:absolute;inset:0;background:radial-gradient(360px 180px at 80% 10%,rgba(243,217,139,.32),transparent 70%)}
  .feature::after{content:"";position:absolute;inset:7px;border:1px solid rgba(243,217,139,.45);border-radius:5px;pointer-events:none}
  .feature .play{flex:none;position:relative;width:104px;height:104px;border-radius:50%;background:linear-gradient(180deg,#f0cf78,#b88a2a);display:grid;place-items:center;
    box-shadow:0 0 0 8px rgba(243,217,139,.18)}
  .feature .play::after{content:"";margin-left:12px;border-left:42px solid var(--navy);border-top:26px solid transparent;border-bottom:26px solid transparent}
  .feature .txt{position:relative;font-family:'Noto Serif JP',serif;font-weight:900;white-space:nowrap}
  .feature .tag{display:inline-block;vertical-align:10px;font-size:26px;line-height:1;color:var(--navy);background:linear-gradient(180deg,#fff3c4,#e2b654);padding:7px 12px 8px;border-radius:4px;letter-spacing:.08em;margin-right:14px;text-shadow:none}
  .feature .l1{font-size:42px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .feature .l1 b{font-size:58px;color:var(--gold2);margin-right:2px}
  .feature .l2{font-size:66px;line-height:1;margin-top:10px;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.02em}
  .feature .l2 em{font-style:normal;color:var(--gold2)}

  /* ---------- footer ---------- */
  .foot{position:relative;margin:48px -40px 0;height:262px;color:#fff;
    background:radial-gradient(700px 260px at 78% 0%,rgba(31,87,200,.45),transparent 70%),linear-gradient(90deg,#0a1a3f,#12306e 55%,#0a1a3f);
    display:flex;align-items:center;padding:0 40px 0 318px;gap:44px}
  .foot::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  .avatar{position:absolute;left:40px;top:-34px;width:250px;height:250px;border-radius:50%;border:8px solid #fff;
    box-shadow:0 0 0 5px var(--gold),0 14px 30px rgba(0,0,0,.35);overflow:hidden;background:#ede4cf}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who{flex:none}
  .who .name{font-family:'Noto Serif JP',serif;font-weight:900;font-size:56px;line-height:1;display:flex;align-items:baseline;gap:16px}
  .who .name small{font-size:26px;color:var(--gold2);letter-spacing:.1em}
  .chips{display:grid;grid-template-columns:auto auto;gap:10px;margin-top:20px}
  .chips span{border:1.5px solid rgba(243,217,139,.7);color:#e9eefb;font-weight:700;font-size:22px;line-height:1;padding:9px 14px;border-radius:6px;background:rgba(255,255,255,.05);white-space:nowrap}
  .chips span b{color:var(--gold2);font-size:28px;margin:0 2px}
  .divider{flex:none;width:2px;height:170px;background:linear-gradient(180deg,transparent,rgba(243,217,139,.8),transparent)}
  .cta{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch}
  .cta .l1{text-align:center;font-weight:900;font-size:30px;color:var(--gold2);letter-spacing:.12em;white-space:nowrap}
  .cta .l1 b{color:#fff}
  .cta .btn{position:relative;margin-top:16px;height:122px;border-radius:999px;display:flex;align-items:center;justify-content:flex-start;gap:20px;padding-left:24px;
    background:linear-gradient(180deg,#22dc72 0%,#06c755 55%,#04ad49 100%);color:#fff;font-weight:900;font-size:54px;letter-spacing:.03em;white-space:nowrap;
    box-shadow:0 7px 0 #037a34,0 16px 30px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 3px 0 rgba(3,122,52,.55)}
  .cta .btn::before{content:"";position:absolute;left:40px;right:40px;top:7px;height:40%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
  .cta .btn img{width:78px;height:78px;border-radius:20px;box-shadow:0 0 0 4px #fff;position:relative}
  .cta .btn span{position:relative}
  .cta .btn i{position:absolute;right:26px;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .cta .btn i::after{content:"";margin-left:8px;border-left:26px solid #06c755;border-top:17px solid transparent;border-bottom:17px solid transparent}
</style>
</head>
<body>
<div class="canvas" id="canvas">

  <div class="eyebrow">日本株<b>×</b>初心者のマイルール構築ガイド</div>

  <div class="main">
    <div class="linebadge"><img src="assets/line.png" alt="LINE"></div>
    <div class="headline">公式LINE登録限定</div>
  </div>

  <div class="offer">
    <div class="stamp"><span>有料級</span></div>
    <div class="copy" id="copy"><span class="max">最大</span><span class="hero"><span class="num">23</span><span class="txt">大特典</span></span><span class="wo">を</span><span class="free">無料</span><span class="pre">プレゼント</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    <div class="avatar"><img src="assets/icon.png" alt=""></div>
    <div class="who">
      <div class="name">カズ<small>兼業投資家</small></div>
      <div class="chips">
        <span>投資歴 <b>8</b>年</span>
        <span>個別指導 <b>400</b>人以上</span>
        <span>SNSフォロワー <b>2.6</b>万人</span>
        <span>簿記2級・FP2級</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="cta">
      <div class="l1">▼ 受け取りは<b>ポスト本文のURL</b>から ▼</div>
      <div class="btn"><img src="assets/line.png" alt=""><span>今すぐ無料で受け取る</span><i></i></div>
    </div>
  </div>
</div>

<script>
  document.body.classList.add('free-' + (new URLSearchParams(location.search).get('free') || 'gold'));
  const pad = n => String(n).padStart(2,'0');
  const card = n => `
    <div class="card"><img src="assets/thumbs/${pad(n)}.jpg" alt="">
      <div class="badge"><small>特典</small><b>${pad(n)}</b></div>
    </div>`;
  document.getElementById('grid').innerHTML =
    Array.from({length:23},(_,i)=>card(i+1)).join('') + `
    <div class="feature">
      <div class="play"></div>
      <div class="txt">
        <div class="l1"><span class="tag">有料級</span><b>4</b>日間の</div>
        <div class="l2"><em>無料</em>特別講義</div>
      </div>
    </div>`;

  // オファー行を横幅いっぱいに合わせる（有料級スタンプ＋コピーで1720px）
  document.fonts.ready.then(() => {
    const row = document.querySelector('.offer'), copy = document.getElementById('copy');
    let lo = 40, hi = 220;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      copy.style.setProperty('--fs', mid + 'px');
      copy.style.justifyContent = 'flex-start';
      const used = document.querySelector('.stamp').offsetWidth + 28 + [...copy.children].reduce((w, c) => w + c.getBoundingClientRect().width, 0) + 12;
      (used <= row.clientWidth ? lo = mid : hi = mid);
    }
    copy.style.setProperty('--fs', lo + 'px');
    copy.style.justifyContent = 'flex-end';
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
